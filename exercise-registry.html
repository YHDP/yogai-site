<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Complete Path — Exercise Registry</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F0FA;
  --card-bg:#ffffff;
  --text:#2D2D2D;
  --accent:#5B4A6F;
  --mat:#E8E0F0;
  --radius:12px;
  --shadow:0 2px 8px rgba(91,74,111,.12);
  --standing:#6B8E6B;
  --seated:#8B7DB8;
  --tabletop:#7EA88F;
  --prone:#C49B6F;
  --supine:#9B8EC4;
  --inversions:#5B7FAE;
  --arm-balance:#C47070;
  --yin:#7BAEAE;
  --pranayama:#AE8B5E;
}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  min-height:100vh;
}
header{
  text-align:center;
  padding:2rem 1rem 1rem;
}
header h1{
  font-size:1.8rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:.25rem;
}
header p{
  color:#6b6b6b;
  font-size:.95rem;
}
nav.tabs{
  display:flex;
  justify-content:center;
  gap:.5rem;
  padding:.75rem 1rem;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:100;
  border-bottom:1px solid #e0d8ea;
}
nav.tabs button{
  padding:.5rem 1.1rem;
  border:2px solid var(--accent);
  background:transparent;
  color:var(--accent);
  border-radius:24px;
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
}
nav.tabs button.active,nav.tabs button:hover{
  background:var(--accent);
  color:#fff;
}
.search-bar{
  max-width:600px;
  margin:0 auto;
  padding:.5rem 1rem 1rem;
}
.search-bar input{
  width:100%;
  padding:.65rem 1rem;
  border:2px solid #d4c8e0;
  border-radius:24px;
  font-size:1rem;
  outline:none;
  background:#fff;
  transition:border-color .2s;
}
.search-bar input:focus{
  border-color:var(--accent);
}
main{
  max-width:1280px;
  margin:0 auto;
  padding:0 1rem 3rem;
}
.view{display:none}
.view.active{display:block}

/* Category View */
.category-group{margin-bottom:1rem}
.category-group summary{
  font-size:1.15rem;
  font-weight:700;
  cursor:pointer;
  padding:.75rem 1rem;
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  list-style:none;
  display:flex;
  align-items:center;
  gap:.6rem;
}
.category-group summary::-webkit-details-marker{display:none}
.category-group summary::before{
  content:'';
  display:inline-block;
  width:8px;height:8px;
  border-right:2.5px solid var(--accent);
  border-bottom:2.5px solid var(--accent);
  transform:rotate(-45deg);
  transition:transform .2s;
  flex-shrink:0;
}
.category-group[open] summary::before{
  transform:rotate(45deg);
}
.category-group .cat-dot{
  width:12px;height:12px;
  border-radius:50%;
  display:inline-block;
  flex-shrink:0;
}
.category-group .cards-grid{
  padding:.75rem 0;
}

/* Cards Grid */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem;
}
@media(max-width:1024px){
  .cards-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .cards-grid{grid-template-columns:1fr}
}

/* Card */
.card{
  background:var(--card-bg);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:box-shadow .2s;
}
.card:hover{
  box-shadow:0 4px 16px rgba(91,74,111,.18);
}
.card .card-svg{
  display:flex;
  justify-content:center;
  padding:1rem 1rem 0;
}
.card .card-svg svg{
  width:160px;
  height:160px;
}
.card .card-body{
  padding:.75rem 1rem 1rem;
}
.card .card-body h3{
  font-size:1.05rem;
  font-weight:700;
  margin-bottom:.1rem;
}
.card .card-body .sanskrit{
  font-style:italic;
  font-size:.88rem;
  color:#7a6f8a;
  margin-bottom:.5rem;
}
.card .badge{
  display:inline-block;
  padding:.15rem .6rem;
  border-radius:12px;
  font-size:.72rem;
  font-weight:600;
  color:#fff;
  margin-bottom:.5rem;
}
.card details{
  margin-bottom:.35rem;
}
.card details summary{
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  color:var(--accent);
  padding:.2rem 0;
}
.card details .detail-content{
  padding:.25rem 0 .25rem .5rem;
  font-size:.82rem;
  color:#4a4a4a;
}
.card details .detail-content ol,
.card details .detail-content ul{
  padding-left:1.2rem;
  margin:.2rem 0;
}
.card details .detail-content li{
  margin-bottom:.15rem;
}
.card .lesson-pills{
  display:flex;
  flex-wrap:wrap;
  gap:.25rem;
  margin-top:.5rem;
}
.card .lesson-pill{
  display:inline-block;
  padding:.1rem .4rem;
  border-radius:8px;
  font-size:.68rem;
  font-weight:600;
  background:var(--mat);
  color:var(--accent);
}

/* Lesson View */
.lesson-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
  margin-bottom:1.25rem;
  justify-content:center;
}
.lesson-buttons button{
  padding:.4rem .7rem;
  border:2px solid var(--accent);
  background:transparent;
  color:var(--accent);
  border-radius:8px;
  font-size:.78rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
}
.lesson-buttons button.active,
.lesson-buttons button:hover{
  background:var(--accent);
  color:#fff;
}
.lesson-title{
  text-align:center;
  margin-bottom:1rem;
  font-size:1.1rem;
  color:var(--accent);
}

/* Alphabetical Jump Bar */
.jump-bar{
  display:flex;
  flex-wrap:wrap;
  gap:.3rem;
  justify-content:center;
  margin-bottom:1rem;
}
.jump-bar a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;height:28px;
  border-radius:50%;
  font-size:.8rem;
  font-weight:700;
  color:var(--accent);
  text-decoration:none;
  background:#fff;
  box-shadow:var(--shadow);
  transition:all .2s;
}
.jump-bar a:hover{
  background:var(--accent);
  color:#fff;
}
.alpha-letter{
  font-size:1.3rem;
  font-weight:700;
  color:var(--accent);
  margin:1.25rem 0 .5rem;
  padding-bottom:.25rem;
  border-bottom:2px solid var(--mat);
}

/* Stats bar */
.stats{
  text-align:center;
  font-size:.82rem;
  color:#8a7f96;
  padding:.25rem 0 .75rem;
}
</style>
</head>

<header>

// RENDERING ENGINE
// ============================================================

function renderSVG(pose) {
  const s = pose.svg;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200');
  svg.setAttribute('xmlns', ns);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', pose.english + ' stick figure');

  const strokeColor = '#5B4A6F';
  const matColor = '#E8E0F0';
  const sw = 2.5;

  function line(x1,y1,x2,y2,color,width) {
    const l = document.createElementNS(ns,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',color||strokeColor);
    l.setAttribute('stroke-width',width||sw);
    l.setAttribute('stroke-linecap','round');
    l.setAttribute('fill','none');
    svg.appendChild(l);
  }

  // Mat
  line(10, 185, 190, 185, matColor, 4);

  // Head
  const head = document.createElementNS(ns,'circle');
  head.setAttribute('cx', s.head.cx);
  head.setAttribute('cy', s.head.cy);
  head.setAttribute('r', s.head.r);
  head.setAttribute('stroke', strokeColor);
  head.setAttribute('stroke-width', sw);
  head.setAttribute('fill', 'none');
  svg.appendChild(head);

  // Shoulder midpoint
  const sMidX = (s.shoulders[0].x + s.shoulders[1].x) / 2;
  const sMidY = (s.shoulders[0].y + s.shoulders[1].y) / 2;
  // Hip midpoint
  const hMidX = (s.hips[0].x + s.hips[1].x) / 2;
  const hMidY = (s.hips[0].y + s.hips[1].y) / 2;

  // Neck (head to shoulder midpoint)
  line(s.head.cx, s.head.cy + s.head.r, sMidX, sMidY);

  // Torso (shoulder midpoint to hip midpoint)
  line(sMidX, sMidY, hMidX, hMidY);

  // Shoulder line
  line(s.shoulders[0].x, s.shoulders[0].y, s.shoulders[1].x, s.shoulders[1].y);

  // Left arm: shoulder -> elbow -> wrist
  line(s.shoulders[0].x, s.shoulders[0].y, s.elbows[0].x, s.elbows[0].y);
  line(s.elbows[0].x, s.elbows[0].y, s.wrists[0].x, s.wrists[0].y);

  // Right arm: shoulder -> elbow -> wrist
  line(s.shoulders[1].x, s.shoulders[1].y, s.elbows[1].x, s.elbows[1].y);
  line(s.elbows[1].x, s.elbows[1].y, s.wrists[1].x, s.wrists[1].y);

  // Hip line
  line(s.hips[0].x, s.hips[0].y, s.hips[1].x, s.hips[1].y);

  // Left leg: hip -> knee -> ankle
  line(s.hips[0].x, s.hips[0].y, s.knees[0].x, s.knees[0].y);
  line(s.knees[0].x, s.knees[0].y, s.ankles[0].x, s.ankles[0].y);

  // Right leg: hip -> knee -> ankle
  line(s.hips[1].x, s.hips[1].y, s.knees[1].x, s.knees[1].y);
  line(s.knees[1].x, s.knees[1].y, s.ankles[1].x, s.ankles[1].y);

  return svg;
}

function createCard(pose) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.id = pose.id;

  const catColor = CATEGORY_COLORS[pose.category] || '#888';

  // SVG
  const svgWrap = document.createElement('div');
  svgWrap.className = 'card-svg';
  svgWrap.appendChild(renderSVG(pose));

  // Body
  const body = document.createElement('div');
  body.className = 'card-body';

  body.innerHTML = `
    <h3>${pose.english}</h3>
    <div class="sanskrit">${pose.sanskrit}</div>
    <span class="badge" style="background:${catColor}">${pose.category}</span>
    <details>
      <summary>Instructions</summary>
      <div class="detail-content">
        <ol>${pose.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>
    </details>
    <details>
      <summary>Alignment Points</summary>
      <div class="detail-content">
        <ul>${pose.alignment.map(a => `<li>${a}</li>`).join('')}</ul>
      </div>
    </details>
    <details>
      <summary>Modifications</summary>
      <div class="detail-content">
        <ul>${pose.modifications.map(m => `<li>${m}</li>`).join('')}</ul>
      </div>
    </details>
    <div class="lesson-pills">
      ${pose.lessons.map(l => {
        const num = String(l).padStart(2,'0');
        return `<span class="lesson-pill">L${num}</span>`;
      }).join('')}
    </div>
  `;

  card.appendChild(svgWrap);
  card.appendChild(body);
  return card;
}

function createTechniqueCard(t) {
  // Techniques have no asana geometry, so the card skips the stick-figure
  // panel and leads with purpose / cues / duration / cautions instead.
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.id = t.id;

  const catColor = TECHNIQUE_COLORS[t.category] || '#888';

  const body = document.createElement('div');
  body.className = 'card-body';

  body.innerHTML = `
    <h3>${t.name}</h3>
    <div class="sanskrit">${t.purpose}</div>
    <span class="badge" style="background:${catColor}">${t.category}</span>
    <details>
      <summary>Typical Cues</summary>
      <div class="detail-content">
        <ul>${t.cues.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </details>
    <details>
      <summary>Duration Guidance</summary>
      <div class="detail-content">
        <ul><li>${t.duration}</li></ul>
      </div>
    </details>
    <details>
      <summary>Cautions</summary>
      <div class="detail-content">
        <ul>${t.cautions.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </details>
    <div class="lesson-pills">
      ${t.lessons.map(l => {
        const num = String(l).padStart(2,'0');
        return `<span class="lesson-pill">L${num}</span>`;
      }).join('')}
    </div>
  `;

  card.appendChild(body);
  return card;
}

// ---- Category View ----
function buildCategoryView() {
  const container = document.getElementById('view-category');
  container.innerHTML = '';

  const categories = ['Standing','Seated','Tabletop','Prone','Supine','Inversions','Arm Balance','Yin','Pranayama'];

  categories.forEach(cat => {
    const poses = POSES.filter(p => p.category === cat);
    if (poses.length === 0) return;

    const details = document.createElement('details');
    details.className = 'category-group';
    details.open = true;

    const summary = document.createElement('summary');
    const dot = document.createElement('span');
    dot.className = 'cat-dot';
    dot.style.background = CATEGORY_COLORS[cat];
    summary.appendChild(dot);
    summary.appendChild(document.createTextNode(`${cat} (${poses.length})`));
    details.appendChild(summary);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    poses.forEach(p => grid.appendChild(createCard(p)));
    details.appendChild(grid);

    container.appendChild(details);
  });
}

  const groups = [

    container.appendChild(details);

}

// ---- Lesson View ----
function buildLessonView() {
  const btnContainer = document.getElementById('lessonButtons');
  btnContainer.innerHTML = '';

  LESSONS.forEach((lesson, i) => {
    const btn = document.createElement('button');
    btn.textContent = lesson.id;
    btn.title = lesson.title + ' (' + lesson.teacher + ')';
    btn.addEventListener('click', () => showLesson(i));
    btnContainer.appendChild(btn);
  });

  // Show first lesson by default
  showLesson(0);
}

function showLesson(index) {
  const lesson = LESSONS[index];
  const lessonNum = index + 1;

  // Update button active state
  const btns = document.querySelectorAll('#lessonButtons button');
  btns.forEach((b,i) => b.classList.toggle('active', i === index));

  // Title
  document.getElementById('lessonTitle').textContent =
    `${lesson.id}: ${lesson.title} (${lesson.teacher})`;

  // Cards
  const container = document.getElementById('lessonCards');
  container.innerHTML = '';

  const poses = POSES.filter(p => p.lessons.includes(lessonNum));
  poses.forEach(p => container.appendChild(createCard(p)));
}

// ---- Alphabetical View ----
function buildAlphaView() {
  const sorted = [...POSES].sort((a,b) => a.english.localeCompare(b.english));

  // Collect letters
  const letters = [...new Set(sorted.map(p => p.english[0].toUpperCase()))].sort();

  // Jump bar
  const jumpBar = document.getElementById('jumpBar');
  jumpBar.innerHTML = '';
  letters.forEach(letter => {
    const a = document.createElement('a');
    a.href = '#alpha-' + letter;
    a.textContent = letter;
    jumpBar.appendChild(a);
  });

  // Content
  const content = document.getElementById('alphaContent');
  content.innerHTML = '';

  letters.forEach(letter => {
    const heading = document.createElement('div');
    heading.className = 'alpha-letter';
    heading.id = 'alpha-' + letter;
    heading.textContent = letter;
    content.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    sorted.filter(p => p.english[0].toUpperCase() === letter)
      .forEach(p => grid.appendChild(createCard(p)));
    content.appendChild(grid);
  });
}

// ---- Search View ----
function setupSearch() {
  const input = document.getElementById('searchInput');
  const container = document.getElementById('searchCards');

  function doSearch() {
    const query = input.value.toLowerCase().trim();
    container.innerHTML = '';

    if (!query) {
      POSES.forEach(p => container.appendChild(createCard(p)));
      updateStats(POSES.length);
      return;
    }

    const results = POSES.filter(p =>
      p.english.toLowerCase().includes(query) ||
      p.sanskrit.toLowerCase().includes(query) ||
      p.category.toLowerCase().includes(query)
    );

    results.forEach(p => container.appendChild(createCard(p)));
    updateStats(results.length);
  }

  input.addEventListener('input', doSearch);

  // Show all on first load
  doSearch();
}

function updateStats(count) {
  document.getElementById('statsBar').textContent =
    `Showing ${count} of ${POSES.length} entries`;
}

// ============================================================
// TAB NAVIGATION
// ============================================================

function initTabs() {
  const tabButtons = document.querySelectorAll('nav.tabs button');
  const views = document.querySelectorAll('.view');
  const searchBar = document.getElementById('searchBarContainer');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const viewId = btn.dataset.view;

      // Update buttons
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Update views
      views.forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');

      // Show search bar for search view, always visible
      if (viewId === 'search') {
        searchBar.style.display = 'block';
        document.getElementById('searchInput').focus();
      } else {
        searchBar.style.display = 'none';
      }

      // Update stats
      if (viewId === 'category' || viewId === 'alpha') {
        updateStats(POSES.length);
      } else if (viewId === 'techniques') {
        document.getElementById('statsBar').textContent =
          `Showing ${TECHNIQUES.length} guided techniques (Modules 7-8)`;
      } else if (viewId === 'lesson') {
        const activeBtn = document.querySelector('#lessonButtons button.active');
        if (activeBtn) {
          const idx = [...document.querySelectorAll('#lessonButtons button')].indexOf(activeBtn);
          const lessonNum = idx + 1;
          const count = POSES.filter(p => p.lessons.includes(lessonNum)).length;
          updateStats(count);
        }
      }
    });
  });
}

// ============================================================
// INIT
// ============================================================

document.addEventListener('DOMContentLoaded', () => {
  buildCategoryView();
  buildLessonView();
  buildAlphaView();
  buildTechniquesView();
  setupSearch();
  initTabs();
  updateStats(POSES.length);
});
</script>
</body>
</html>
